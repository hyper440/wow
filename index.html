<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filester Albums</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --line: #263244;
        --accent: #38bdf8;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(12px);
      }
      .bar {
        display: grid;
        grid-template-columns: 1fr minmax(260px, 560px) auto auto auto;
        gap: 12px;
        align-items: center;
        padding: 14px 18px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }
      input, button, a.button {
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }
      input {
        width: 100%;
        padding: 0 10px;
      }
      input.invalid {
        border-color: var(--danger);
        outline-color: var(--danger);
      }
      button, a.button {
        padding: 0 10px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      .help {
        width: 36px;
        justify-content: center;
        padding: 0;
        border-radius: 999px;
        font-weight: 700;
      }
      main { padding: 0 18px 18px; }
      .status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .status strong { color: var(--text); font-weight: 600; }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1180px;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
        font-size: 13px;
        vertical-align: top;
      }
      th {
        position: sticky;
        top: 0;
        background: #182235;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      td { white-space: nowrap; }
      td:first-child, td:last-child {
        white-space: normal;
        min-width: 320px;
      }
      tr:last-child td { border-bottom: 0; }
      a { color: var(--accent); }
      @media (max-width: 860px) {
        .bar { grid-template-columns: 1fr; }
        .status { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Filester Albums</h1>
        <input id="search" type="search" placeholder="filename terms  #tag terms  /regex/  #/tag-regex/" spellcheck="false" />
        <button class="help" type="button" title="Plain terms search filenames. Prefix tags with #, e.g. #blonde. Regex works as /pattern/ for filenames and #/pattern/ for tags. Combine terms to require all filters." aria-label="Filtering help">?</button>
        <button id="copyUrls" type="button">Copy URLs</button>
        <a class="button" href="filester-albums.csv">CSV</a>
      </div>
    </header>
    <main>
      <div class="status">
        <span id="summary">Loading CSV...</span>
        <span id="updated"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Size</th>
              <th>Duration</th>
              <th>Filester URL</th>
              <th>Studio ID</th>
              <th>Tags</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <script>
      const state = { rows: [], filtered: [], filterError: '' };
      const els = {
        rows: document.getElementById('rows'),
        search: document.getElementById('search'),
        summary: document.getElementById('summary'),
        updated: document.getElementById('updated'),
        copyUrls: document.getElementById('copyUrls'),
      };

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = '';
        let quoted = false;
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];
          if (quoted) {
            if (char === '"' && next === '"') { value += '"'; i++; }
            else if (char === '"') quoted = false;
            else value += char;
          } else if (char === '"') quoted = true;
          else if (char === ',') { row.push(value); value = ''; }
          else if (char === '\n') { row.push(value); rows.push(row); row = []; value = ''; }
          else if (char !== '\r') value += char;
        }
        if (value || row.length) { row.push(value); rows.push(row); }
        return rows;
      }

      function formatBytes(value) {
        const bytes = Number(value);
        if (!Number.isFinite(bytes) || bytes <= 0) return '';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = bytes;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
        return `${size.toFixed(unit === 0 ? 0 : 2)} ${units[unit]}`;
      }

      function formatDuration(value) {
        const seconds = Math.round(Number(value));
        if (!Number.isFinite(seconds) || seconds <= 0) return '';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return h > 0
          ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
          : `${m}:${String(s).padStart(2, '0')}`;
      }

      function tokenizeQuery(query) {
        return query.match(/(?:[^\s/]+|\/(?:\\.|[^/])+\/[a-z]*)+/gi) || [];
      }

      function matcherFromToken(rawToken) {
        let field = 'filename';
        let token = rawToken;
        if (token.startsWith('#')) {
          field = 'tags';
          token = token.slice(1);
        } else if (/^(tag|tags):/i.test(token)) {
          field = 'tags';
          token = token.replace(/^(tag|tags):/i, '');
        } else if (/^(name|file|filename):/i.test(token)) {
          token = token.replace(/^(name|file|filename):/i, '');
        }

        const regexMatch = token.match(/^\/(.*)\/([a-z]*)$/i);
        if (regexMatch) {
          try {
            const flags = regexMatch[2].includes('i') ? regexMatch[2] : `${regexMatch[2]}i`;
            const regex = new RegExp(regexMatch[1], flags);
            return { field, test: (value) => regex.test(value) };
          } catch (error) {
            state.filterError = error.message;
            return null;
          }
        }

        const needle = token.toLowerCase();
        return { field, test: (value) => value.toLowerCase().includes(needle) };
      }

      function buildMatchers(query) {
        state.filterError = '';
        return tokenizeQuery(query)
          .map(matcherFromToken)
          .filter(Boolean);
      }

      function applyFilter() {
        const matchers = buildMatchers(els.search.value.trim());
        els.search.classList.toggle('invalid', state.filterError !== '');
        if (state.filterError) {
          state.filtered = [];
          render();
          return;
        }
        state.filtered = matchers.length > 0
          ? state.rows.filter((row) => matchers.every((matcher) => matcher.test(row[matcher.field] || '')))
          : state.rows;
        render();
      }

      function cell(text) {
        const td = document.createElement('td');
        td.textContent = text;
        return td;
      }

      function render() {
        els.rows.replaceChildren(...state.filtered.map((row) => {
          const tr = document.createElement('tr');
          tr.append(cell(row.filename));
          tr.append(cell(formatBytes(row.size)));
          tr.append(cell(formatDuration(row.duration)));
          const urlCell = document.createElement('td');
          if (row.filesterUrl) {
            const a = document.createElement('a');
            a.href = row.filesterUrl;
            a.textContent = row.filesterUrl;
            a.target = '_blank';
            a.rel = 'noreferrer';
            urlCell.append(a);
          }
          tr.append(urlCell);
          tr.append(cell(row.studioId));
          tr.append(cell(row.tags));
          return tr;
        }));
        els.summary.innerHTML = state.filterError
          ? `<strong>Invalid regex:</strong> ${state.filterError}`
          : `${state.filtered.length.toLocaleString()} of ${state.rows.length.toLocaleString()} files`;
      }

      async function copyFilteredUrls() {
        const urls = state.filtered
          .map((row) => row.filesterUrl)
          .filter((url) => url.trim() !== '');
        await navigator.clipboard.writeText(urls.join('\n'));
        const previous = els.copyUrls.textContent;
        els.copyUrls.textContent = `Copied ${urls.length}`;
        setTimeout(() => { els.copyUrls.textContent = previous; }, 1400);
      }

      els.search.addEventListener('input', applyFilter);
      els.copyUrls.addEventListener('click', copyFilteredUrls);

      fetch(`filester-albums.csv?t=${Date.now()}`)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const modified = response.headers.get('last-modified');
          if (modified) els.updated.textContent = `Updated ${new Date(modified).toLocaleString()}`;
          return response.text();
        })
        .then((text) => {
          const parsed = parseCsv(text);
          const header = parsed.shift() || [];
          const index = Object.fromEntries(header.map((name, i) => [name, i]));
          state.rows = parsed.filter((row) => row.length > 1).map((row) => ({
            filename: row[index.filename] || '',
            size: row[index.size] || '',
            duration: row[index.duration] || '',
            filesterUrl: row[index['filester url']] || '',
            studioId: row[index['studio id']] || '',
            tags: row[index.tags] || '',
          }));
          state.filtered = state.rows;
          render();
        })
        .catch((error) => {
          els.summary.textContent = `Failed to load CSV: ${error.message}`;
        });
    </script>
  </body>
</html>
