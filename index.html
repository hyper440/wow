<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filester Albums</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --line: #263244;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(12px);
      }
      .bar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
        padding: 14px 18px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input, select, button, a.button {
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }
      input {
        width: min(440px, 42vw);
        padding: 0 10px;
      }
      select, button, a.button {
        padding: 0 10px;
      }
      button, a.button {
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }
      button:disabled { opacity: .45; cursor: default; }
      main { padding: 0 18px 18px; }
      .status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
      }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 8px 10px;
        text-align: left;
        font-size: 13px;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #182235;
        color: var(--muted);
        font-weight: 600;
      }
      td:first-child {
        white-space: normal;
        min-width: 360px;
      }
      tr:last-child td { border-bottom: 0; }
      a { color: var(--accent); }
      .pager {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
        padding: 12px 0 0;
      }
      @media (max-width: 760px) {
        .bar { grid-template-columns: 1fr; }
        .controls { flex-wrap: wrap; }
        input { width: 100%; }
        .status { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Filester Albums</h1>
        <div class="controls">
          <input id="search" type="search" placeholder="Search filename or studio id" />
          <select id="pageSize">
            <option value="100">100 rows</option>
            <option value="250" selected>250 rows</option>
            <option value="500">500 rows</option>
            <option value="1000">1000 rows</option>
          </select>
        </div>
        <a class="button" href="filester-albums.csv">CSV</a>
      </div>
    </header>
    <main>
      <div class="status">
        <span id="summary">Loading CSV...</span>
        <span id="updated"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Size</th>
              <th>Duration</th>
              <th>Filester URL</th>
              <th>Studio ID</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prev">Prev</button>
        <span id="page"></span>
        <button id="next">Next</button>
      </div>
    </main>
    <script>
      const state = { rows: [], filtered: [], page: 1, pageSize: 250 };
      const els = {
        rows: document.getElementById('rows'),
        search: document.getElementById('search'),
        pageSize: document.getElementById('pageSize'),
        summary: document.getElementById('summary'),
        updated: document.getElementById('updated'),
        prev: document.getElementById('prev'),
        next: document.getElementById('next'),
        page: document.getElementById('page'),
      };

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = '';
        let quoted = false;
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const next = text[i + 1];
          if (quoted) {
            if (char === '"' && next === '"') { value += '"'; i++; }
            else if (char === '"') quoted = false;
            else value += char;
          } else if (char === '"') quoted = true;
          else if (char === ',') { row.push(value); value = ''; }
          else if (char === '\n') { row.push(value); rows.push(row); row = []; value = ''; }
          else if (char !== '\r') value += char;
        }
        if (value || row.length) { row.push(value); rows.push(row); }
        return rows;
      }

      function formatBytes(value) {
        const bytes = Number(value);
        if (!Number.isFinite(bytes) || bytes <= 0) return '';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = bytes;
        let unit = 0;
        while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit++; }
        return `${size.toFixed(unit === 0 ? 0 : 2)} ${units[unit]}`;
      }

      function formatDuration(value) {
        const seconds = Math.round(Number(value));
        if (!Number.isFinite(seconds) || seconds <= 0) return '';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return h > 0
          ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
          : `${m}:${String(s).padStart(2, '0')}`;
      }

      function applyFilter() {
        const query = els.search.value.trim().toLowerCase();
        state.filtered = query
          ? state.rows.filter((row) => row.filename.toLowerCase().includes(query) || row.studioId.toLowerCase().includes(query))
          : state.rows;
        state.page = 1;
        render();
      }

      function render() {
        const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
        state.page = Math.min(state.page, totalPages);
        const start = (state.page - 1) * state.pageSize;
        const pageRows = state.filtered.slice(start, start + state.pageSize);
        els.rows.replaceChildren(...pageRows.map((row) => {
          const tr = document.createElement('tr');
          const cells = [row.filename, formatBytes(row.size), formatDuration(row.duration), row.filesterUrl, row.studioId];
          for (const cell of cells) {
            const td = document.createElement('td');
            if (cell === row.filesterUrl && cell) {
              const a = document.createElement('a');
              a.href = cell;
              a.textContent = cell;
              a.target = '_blank';
              a.rel = 'noreferrer';
              td.append(a);
            } else {
              td.textContent = cell;
            }
            tr.append(td);
          }
          return tr;
        }));
        els.summary.textContent = `${state.filtered.length.toLocaleString()} of ${state.rows.length.toLocaleString()} files`;
        els.page.textContent = `Page ${state.page} / ${totalPages}`;
        els.prev.disabled = state.page <= 1;
        els.next.disabled = state.page >= totalPages;
      }

      els.search.addEventListener('input', applyFilter);
      els.pageSize.addEventListener('change', () => { state.pageSize = Number(els.pageSize.value); state.page = 1; render(); });
      els.prev.addEventListener('click', () => { state.page--; render(); });
      els.next.addEventListener('click', () => { state.page++; render(); });

      fetch(`filester-albums.csv?t=${Date.now()}`)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const modified = response.headers.get('last-modified');
          if (modified) els.updated.textContent = `Updated ${new Date(modified).toLocaleString()}`;
          return response.text();
        })
        .then((text) => {
          const parsed = parseCsv(text);
          const header = parsed.shift() || [];
          const index = Object.fromEntries(header.map((name, i) => [name, i]));
          state.rows = parsed.filter((row) => row.length > 1).map((row) => ({
            filename: row[index.filename] || '',
            size: row[index.size] || '',
            duration: row[index.duration] || '',
            filesterUrl: row[index['filester url']] || '',
            studioId: row[index['studio id']] || '',
          }));
          state.filtered = state.rows;
          render();
        })
        .catch((error) => {
          els.summary.textContent = `Failed to load CSV: ${error.message}`;
        });
    </script>
  </body>
</html>
